name: SpellDuel skill icon polish validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'spellduel-unity/Assets/SpellDuel/Runtime/SkillIcons*.cs'
      - 'spellduel-unity/Assets/SpellDuel/Editor/Snapshot.UiIcons.cs'
      - '.github/workflows/spellduel-ui-icons.yml'
concurrency:
  group: ui-icon-polish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baseline icon artwork
        if: matrix.version == 'before'
        run: git show 00e7795:spellduel-unity/Assets/SpellDuel/Runtime/SkillIcons.cs > spellduel-unity/Assets/SpellDuel/Runtime/SkillIcons.cs
      - uses: actions/cache@v4
        with:
          path: spellduel-unity/Library
          key: Library-Android-${{ hashFiles('spellduel-unity/Packages/manifest.json', 'spellduel-unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: spellduel-unity
          targetPlatform: Android
          buildName: SpellDuel
          buildMethod: SpellDuel.EditorTools.Snapshot.RenderUiIcons
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpellDuel-ui-icons-${{ matrix.version }}
          path: |
            spellduel-unity/snapshots/ui-icons/
          if-no-files-found: error
