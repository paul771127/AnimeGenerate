name: SpellDuel Unity build (Android APK + iOS unsigned IPA)

# 推送 spellduel-unity/ 的變更時自動編譯；也可以在 Actions 頁面手動執行
# iOS：平常上傳到「開發版」SpellDuel Dev（只有自己的測試群組）；
#      要發布給朋友（正式版 SpellDuel）＝手動執行時勾「release」，或 commit 訊息寫 [release]
on:
  push:
    paths:
      - 'spellduel-unity/**'
      - '.github/workflows/spellduel-unity.yml'
  workflow_dispatch:
    inputs:
      release:
        description: '發布給朋友：上傳到正式版 SpellDuel（不勾＝上傳到開發版 SpellDuel Dev）'
        type: boolean
        default: false

concurrency:
  group: spellduel-unity-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: spellduel-unity
  BUILD_METHOD: SpellDuel.EditorTools.BuildScript.Build

jobs:
  # 沒有設定 Unity 授權時跳過編譯（顯示提示，不讓整個流程變紅）
  check-license:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::尚未設定 UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD，略過 Unity 編譯。設定方式見 spellduel-unity/README.md"
          fi

  android:
    needs: check-license
    if: needs.check-license.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 釋放磁碟空間（Unity 映像檔很大）
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-${{ hashFiles('spellduel-unity/Packages/manifest.json', 'spellduel-unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      # 固定的 Android 簽章金鑰：每次建置都用同一把，手機才能直接覆蓋更新。
      # 有設定 secrets.ANDROID_KEYSTORE_BASE64（＋ANDROID_KEYSTORE_PASS）就用它；否則第一次自動產生一把，存在 Actions 快取裡重複使用。
      - name: 簽章金鑰（快取）
        uses: actions/cache@v4
        with:
          path: ci-keystore
          key: spellduel-android-keystore-v1
      - name: 準備簽章金鑰
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -eo pipefail
          mkdir -p ci-keystore
          PASS="${KS_PASS:-spellduel-ci}"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ci-keystore/spellduel.keystore
            echo "使用 secrets 裡的簽章金鑰"
          elif [ ! -f ci-keystore/spellduel.keystore ]; then
            keytool -genkeypair -keystore ci-keystore/spellduel.keystore -alias spellduel -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=SpellDuel, O=SpellDuel"
            echo "產生新的簽章金鑰（之後都用這一把）"
          else
            echo "沿用快取裡的簽章金鑰"
          fi
          keytool -list -v -keystore ci-keystore/spellduel.keystore -storepass "$PASS" | grep -m1 "SHA256:" || true
          B64=$(base64 -w0 ci-keystore/spellduel.keystore)
          echo "::add-mask::$B64"
          echo "::add-mask::$PASS"
          echo "b64=$B64" >> "$GITHUB_OUTPUT"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: Android
          buildName: SpellDuel
          buildMethod: ${{ env.BUILD_METHOD }}
          allowDirtyBuild: true
          customParameters: -sdCloudProjectId ${{ secrets.UNITY_CLOUD_PROJECT_ID }}
          androidKeystoreName: spellduel.keystore
          androidKeystoreBase64: ${{ steps.keystore.outputs.b64 }}
          androidKeystorePass: ${{ steps.keystore.outputs.pass }}
          androidKeyaliasName: spellduel
          androidKeyaliasPass: ${{ steps.keystore.outputs.pass }}
      - name: 檢查 APK 簽章
        run: |
          APK=$(ls build/Android/*.apk | head -1)
          SIGNER=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$SIGNER" ]; then "$SIGNER" verify --print-certs "$APK" | grep -m2 -E "SHA-256|DN" || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: SpellDuel-Android-APK
          path: build/Android/*.apk
          if-no-files-found: error

  ios-export:
    needs: check-license
    if: needs.check-license.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 釋放磁碟空間（Unity 映像檔很大）
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-iOS-${{ hashFiles('spellduel-unity/Packages/manifest.json', 'spellduel-unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-iOS-
      # 第一階段：只做設定（加入 ARKit 編譯符號），第二階段重新開 Unity 才會把 ARKit 原生程式庫打包進去
      - name: Unity 設定（第一階段）
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildName: SpellDuel
          buildMethod: SpellDuel.EditorTools.BuildScript.ConfigureCI
          allowDirtyBuild: true
          customParameters: -sdCloudProjectId ${{ secrets.UNITY_CLOUD_PROJECT_ID }}
      - name: Unity 匯出 Xcode 專案（第二階段）
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildName: SpellDuel
          buildMethod: ${{ env.BUILD_METHOD }}
          allowDirtyBuild: true
          customParameters: -sdCloudProjectId ${{ secrets.UNITY_CLOUD_PROJECT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: SpellDuel-iOS-XcodeProject
          path: build/iOS
          if-no-files-found: error

  # 公開 repo 的 GitHub macOS 機器免費；產出「未簽署」IPA（之後由 ios-testflight 簽章上傳）
  # App Store Connect 要求用 iOS 26 SDK（Xcode 26）以上編譯，所以用 macos-26 機器
  ios-ipa:
    needs: ios-export
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: spellduel-unity/AppIcon
      - uses: actions/download-artifact@v4
        with:
          name: SpellDuel-iOS-XcodeProject
          path: xcode
      - name: 放入 App 圖示（1024×1024，App Store 必要）
        run: |
          set -eo pipefail
          ICON=src/spellduel-unity/AppIcon/AppIcon-1024.png
          ICONSET=$(find xcode -type d -path "*Images.xcassets/AppIcon.appiconset" | head -1)
          if [ -z "$ICONSET" ]; then
            XCASSETS=$(find xcode -type d -name "Images.xcassets" | head -1)
            ICONSET="$XCASSETS/AppIcon.appiconset"; mkdir -p "$ICONSET"
          fi
          echo "圖示資料夾：$ICONSET"
          rm -f "$ICONSET"/*
          cp "$ICON" "$ICONSET/AppIcon-1024.png"
          # 單一尺寸圖示：Xcode 會自動產生其他所有尺寸
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "AppIcon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
      - name: 編譯未簽署 IPA
        run: |
          set -eo pipefail
          xcodebuild -version
          PROJ=$(find xcode -name "Unity-iPhone.xcodeproj" -maxdepth 3 | head -1)
          echo "Xcode 專案：$PROJ"
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | tail -50
          APP=$(find dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry SpellDuel-unsigned.ipa Payload
          ls -la SpellDuel-unsigned.ipa
          echo "--- 檢查：SDK 版本與 1024 圖示 ---"
          /usr/libexec/PlistBuddy -c "Print :DTSDKName" Payload/*.app/Info.plist || true
          xcrun --sdk iphoneos assetutil --info Payload/*.app/Assets.car | grep -E '"(Name|PixelHeight)"' | grep -B1 '1024' | head -4 || echo "::warning::Assets.car 裡沒找到 1024 圖示"
      - uses: actions/upload-artifact@v4
        with:
          name: SpellDuel-iOS-unsigned-IPA
          path: SpellDuel-unsigned.ipa
          if-no-files-found: error

  # 把最新 APK 放到公開的 Release（不用登入 GitHub 就能下載，網址固定）：
  #   https://github.com/<owner>/<repo>/releases/download/spellduel-latest/SpellDuel.apk
  publish-apk:
    needs: android
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SpellDuel-Android-APK
          path: apk
      - name: 上傳到 Release「spellduel-latest」
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          cp "$(ls apk/*.apk | head -1)" SpellDuel.apk
          NOTES="最新 Android 版（${GITHUB_SHA::7}，$(date -u +'%Y-%m-%d %H:%M') UTC）。下載 SpellDuel.apk 直接安裝。"
          if ! gh release view spellduel-latest >/dev/null 2>&1; then
            gh release create spellduel-latest --target "$GITHUB_SHA" --title "SpellDuel 最新測試版" --notes "$NOTES" --latest
          fi
          gh release upload spellduel-latest SpellDuel.apk --clobber
          gh release edit spellduel-latest --notes "$NOTES"

  # 用 Apple Distribution 憑證重簽 IPA，上傳到 App Store Connect（TestFlight）。
  #   平常：開發版 com.paul771127.spellduel.dev（App 名稱 SpellDuel Dev，只給自己測）
  #   發布：正式版 com.paul771127.spellduel（朋友的群組）＝手動執行勾 release，或 commit 訊息有 [release]
  # 需要的 secrets（缺任何一個就自動略過，不會讓流程變紅）：
  #   IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD / APPSTORE_ISSUER_ID / APPSTORE_API_KEY_ID / APPSTORE_API_PRIVATE_KEY
  #   正式版 profile：IOS_APPSTORE_PROFILE_BASE64；開發版 profile：IOS_APPSTORE_PROFILE_DEV_BASE64（沒設就不上傳，不會誤發給朋友）
  ios-testflight:
    needs: ios-ipa
    runs-on: ubuntu-latest
    timeout-minutes: 75  # 上傳後會等 Apple 處理完 build（可能 30 分鐘以上）
    env:
      RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || contains(github.event.head_commit.message, '[release]') }}
    steps:
      - name: 檢查簽章與上傳設定
        id: check
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_REL: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          PROFILE_DEV: ${{ secrets.IOS_APPSTORE_PROFILE_DEV_BASE64 }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # 開發版的描述檔由下面的簽章步驟用 API 金鑰向 Apple 拿（沒有就建），不一定要設 IOS_APPSTORE_PROFILE_DEV_BASE64
          if [ "$RELEASE" = "true" ]; then PROFILE="$PROFILE_REL"; WHO="正式版（朋友）"; else PROFILE="api"; WHO="開發版（自己）"; fi
          if [ -n "$P12" ] && [ -n "$P12_PASS" ] && [ -n "$PROFILE" ] && [ -n "$ISSUER" ] && [ -n "$KEY_ID" ] && [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::這次上傳到 TestFlight：$WHO"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$WHO 的 iOS 簽章 / App Store Connect secrets 沒設齊，略過 TestFlight 上傳。"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: SpellDuel-iOS-unsigned-IPA
          path: unsigned

      - name: 編譯 zsign（Linux 上的 iOS 簽章工具）
        if: steps.check.outputs.ok == 'true'
        run: |
          set -eo pipefail
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q g++ make pkg-config libssl-dev libminizip-dev zlib1g-dev >/dev/null
          git clone -q https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign"
          git -C "$RUNNER_TEMP/zsign" checkout -q 9299685bab7ef99827e06e5dfda93af747386590
          make -C "$RUNNER_TEMP/zsign/build/linux" -j4 >/dev/null
          echo "$RUNNER_TEMP/zsign/bin" >> "$GITHUB_PATH"

      - name: 調整 Info.plist 並簽章
        id: sign
        if: steps.check.outputs.ok == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_REL: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          PROFILE_DEV: ${{ secrets.IOS_APPSTORE_PROFILE_DEV_BASE64 }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          S="$RUNNER_TEMP/sign"; mkdir -p "$S/x"
          # 先檢查每個 secret 是不是有效的 base64：印出長度、指紋（sha256 前 12 碼）、不合法字元數（不會洩漏內容），
          # 可以和自己電腦上 `base64 -i 檔案 | tr -d '\n' | shasum -a 256` 的前 12 碼比對是不是同一份
          check_b64() {
            local v bad; v=$(printf '%s' "$2" | tr -d ' \t\r\n'); bad=$(printf '%s' "$v" | tr -d 'A-Za-z0-9+/=' | wc -c)
            echo "$1：長度 ${#v}、指紋 $(printf '%s' "$v" | sha256sum | cut -c1-12)、不合法字元 ${bad} 個"
            if [ "$bad" -gt 0 ] || ! printf '%s' "$v" | base64 -d > /dev/null 2>&1; then echo "::error::$1 不是有效的 base64，請重新產生後貼上"; return 1; fi
          }
          check_b64 IOS_DIST_P12_BASE64 "$P12"
          echo "$P12" | base64 -d > "$S/dist.p12"
          if [ "$RELEASE" = "true" ]; then
            check_b64 IOS_APPSTORE_PROFILE_BASE64 "$PROFILE_REL"
            # 描述檔 secret 貼上時常混進空白或換行（base64 -d 會報 invalid input）：先去掉再解碼
            printf '%s' "$PROFILE_REL" | tr -d ' \t\r\n' | base64 -d > "$S/appstore.mobileprovision"
          # 開發版：用 App Store Connect API 金鑰向 Apple 拿 com.paul771127.spellduel.dev 的 App Store 描述檔
          # （有效、包含這張 Distribution 憑證；沒有就建一個），不用再手動貼描述檔；API 失敗才退回 IOS_APPSTORE_PROFILE_DEV_BASE64
          elif S="$S" python3 -I - "com.paul771127.spellduel.dev" "$S/dist.p12" "$S/appstore.mobileprovision" <<'ASC'
          import base64, json, os, subprocess, sys, time, urllib.error, urllib.request
          bundle, p12, out = sys.argv[1:4]
          iss, kid, key, S = os.environ["ISSUER"], os.environ["KEY_ID"], os.environ["KEY"], os.environ["S"]
          BASE = os.environ.get("ASC_BASE", "https://api.appstoreconnect.apple.com")

          def b64u(b): return base64.urlsafe_b64encode(b).rstrip(b"=").decode()

          def der_to_raw(der):   # ECDSA 簽章 DER（SEQUENCE{r,s}）→ JWT 要的 r‖s 各 32 bytes
              i = 2 if der[1] < 0x80 else 2 + (der[1] & 0x7F)
              raw = b""
              for _ in range(2):
                  n = der[i + 1]; raw += der[i + 2:i + 2 + n].lstrip(b"\0").rjust(32, b"\0"); i += 2 + n
              return raw

          def token():
              kp = os.path.join(S, "asc.p8")
              pem = key.replace("\\n", "\n").strip()
              if not pem.startswith("-----"): pem = "-----BEGIN PRIVATE KEY-----\n" + pem + "\n-----END PRIVATE KEY-----"
              with open(os.open(kp, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), "w") as f: f.write(pem + "\n")
              now = int(time.time())
              msg = (b64u(json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}).encode()) + "." +
                     b64u(json.dumps({"iss": iss, "iat": now, "exp": now + 1100, "aud": "appstoreconnect-v1"}).encode()))
              der = subprocess.run(["openssl", "dgst", "-sha256", "-sign", kp], input=msg.encode(), capture_output=True, check=True).stdout
              os.remove(kp)
              return msg + "." + b64u(der_to_raw(der))

          TOKEN = token()

          def api(method, path, body=None):
              req = urllib.request.Request(BASE + path, method=method, data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  print(f"App Store Connect API {method} {path.split('?')[0]} → {e.code}：{e.read().decode(errors='replace')[:600]}")
                  raise

          def serial_of_p12():
              for extra in (["-legacy"], []):   # OpenSSL 3 讀舊格式 p12 要 -legacy
                  r = subprocess.run(["openssl", "pkcs12", "-in", p12, "-nokeys", "-clcerts", "-passin", "env:P12_PASS"] + extra, capture_output=True)
                  if r.returncode == 0 and b"BEGIN CERTIFICATE" in r.stdout:
                      s = subprocess.run(["openssl", "x509", "-noout", "-serial"], input=r.stdout, capture_output=True, check=True).stdout.decode()
                      return s.strip().split("=", 1)[1]
              raise SystemExit("讀不到 p12 裡的憑證（密碼錯？）")

          norm = lambda x: (x or "").upper().lstrip("0")
          serial = serial_of_p12()
          cert = next((c for c in api("GET", "/v1/certificates?limit=200")["data"] if norm(c["attributes"].get("serialNumber")) == norm(serial)), None)
          if not cert: raise SystemExit(f"App Store Connect 找不到序號 {serial} 的憑證（p12 和帳號裡的 Distribution 憑證不是同一張）")
          print(f"Distribution 憑證：{cert['attributes'].get('name')}（{cert['attributes'].get('certificateType')}，到期 {cert['attributes'].get('expirationDate')}）")

          bid = next((b for b in api("GET", f"/v1/bundleIds?filter[identifier]={bundle}&limit=200")["data"] if b["attributes"]["identifier"] == bundle), None)
          if not bid:
              bid = api("POST", "/v1/bundleIds", {"data": {"type": "bundleIds", "attributes": {"identifier": bundle, "name": "SpellDuel Dev", "platform": "IOS"}}})["data"]
              print(f"已註冊 App ID {bundle}")

          content = None
          for p in api("GET", f"/v1/bundleIds/{bid['id']}/profiles?limit=200")["data"]:
              a = p["attributes"]
              if a.get("profileType") != "IOS_APP_STORE" or a.get("profileState") != "ACTIVE": continue
              if cert["id"] not in [c["id"] for c in api("GET", f"/v1/profiles/{p['id']}/certificates?limit=200")["data"]]: continue
              content = a.get("profileContent") or api("GET", f"/v1/profiles/{p['id']}")["data"]["attributes"]["profileContent"]
              print(f"使用現有的描述檔：{a.get('name')}（到期 {a.get('expirationDate')}）")
              break
          if content is None:
              r = api("POST", "/v1/profiles", {"data": {"type": "profiles",
                  "attributes": {"name": f"SpellDuel Dev App Store {time.strftime('%Y%m%d%H%M')}", "profileType": "IOS_APP_STORE"},
                  "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bid["id"]}},
                                    "certificates": {"data": [{"type": "certificates", "id": cert["id"]}]}}}})["data"]
              content = r["attributes"]["profileContent"]
              print(f"已建立新的描述檔：{r['attributes'].get('name')}")
          with open(out, "wb") as f: f.write(base64.b64decode(content))
          ASC
          then echo "開發版描述檔：由 App Store Connect API 取得"
          elif [ -n "$PROFILE_DEV" ]; then
            echo "::warning::App Store Connect API 拿不到描述檔（原因見上面），改用 IOS_APPSTORE_PROFILE_DEV_BASE64"
            check_b64 IOS_APPSTORE_PROFILE_DEV_BASE64 "$PROFILE_DEV"
            printf '%s' "$PROFILE_DEV" | tr -d ' \t\r\n' | base64 -d > "$S/appstore.mobileprovision"
          else echo "::error::App Store Connect API 拿不到開發版描述檔（原因見上面），也沒有設 IOS_APPSTORE_PROFILE_DEV_BASE64"; exit 1
          fi
          unzip -q unsigned/SpellDuel-unsigned.ipa -d "$S/x"
          PLIST=$(ls -d "$S"/x/Payload/*.app)/Info.plist
          # Build 號：Unity 寫入的 yyMMddHH 加上流程編號，同一小時內多次建置也不會撞號
          # 開發版：Bundle ID 加 .dev、桌面名稱「SpellDuel Dev」（和正式版分開，可以同時裝）
          python3 -I - "$PLIST" "${{ github.run_number }}" "$RELEASE" <<'PY'
          import plistlib, sys
          path, run, rel = sys.argv[1], sys.argv[2], sys.argv[3] == "true"
          with open(path, 'rb') as f: p = plistlib.load(f)
          if not rel:
              p['CFBundleIdentifier'] = "com.paul771127.spellduel.dev"
              p['CFBundleDisplayName'] = "SpellDuel Dev"
          base = str(p.get('CFBundleVersion', '0')).split('.')[0]
          p['CFBundleVersion'] = f"{base}.{run}"
          p['ITSAppUsesNonExemptEncryption'] = False
          with open(path, 'wb') as f: plistlib.dump(p, f)
          print("Bundle ID:", p['CFBundleIdentifier'], " Version:", p.get('CFBundleShortVersionString'), " Build:", p['CFBundleVersion'])
          PY
          (cd "$S/x" && zip -qry "$S/patched.ipa" Payload)
          zsign -k "$S/dist.p12" -p "$P12_PASS" -m "$S/appstore.mobileprovision" -o "$S/signed.ipa" "$S/patched.ipa"
          # zsign 輸出不壓縮，重新壓縮讓上傳更快
          rm -rf "$S/y" && mkdir -p "$S/y" && unzip -q "$S/signed.ipa" -d "$S/y"
          (cd "$S/y" && zip -q -9 -ry "$GITHUB_WORKSPACE/SpellDuel-appstore.ipa" Payload)
          rm -f "$S/dist.p12"
          ls -la "$GITHUB_WORKSPACE/SpellDuel-appstore.ipa"
          echo "ipa=$GITHUB_WORKSPACE/SpellDuel-appstore.ipa" >> "$GITHUB_OUTPUT"

      - name: 上傳到 TestFlight
        if: steps.check.outputs.ok == 'true'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.sign.outputs.ipa }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # 加密申報已寫在 Info.plist（ITSAppUsesNonExemptEncryption=false），不再用 API 另外設定
