name: SpellDuel remaining art validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'spellduel-unity/Assets/SpellDuel/**'
      - '.github/workflows/spellduel-remaining-art.yml'
concurrency:
  group: remaining-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  remaining-art:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: spellduel-unity/Library
          key: Library-Android-${{ hashFiles('spellduel-unity/Packages/manifest.json', 'spellduel-unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: spellduel-unity
          targetPlatform: Android
          buildName: SpellDuel
          buildMethod: SpellDuel.EditorTools.Snapshot.RenderRemainingArt
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpellDuel-remaining-art
          path: |
            spellduel-unity/snapshots/remaining_*.png
            spellduel-unity/snapshots/remaining_art_audit.json
          if-no-files-found: error
