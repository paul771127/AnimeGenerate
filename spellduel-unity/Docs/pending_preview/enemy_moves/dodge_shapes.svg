<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><rect width="1200" height="740" fill="#182331"/><style>text{font-family:Arial,sans-serif;fill:#eef3ed;font-size:22px}.small{font-size:16px}</style><text x="40" y="45">ENEMY MOVE PROPOSAL / BODY-READABLE WARNINGS</text><rect x="30" y="80" width="240" height="580" rx="18" fill="#26384b"/><text x="48" y="119">LOCKED LANE</text><rect x="330" y="80" width="240" height="580" rx="18" fill="#26384b"/><text x="348" y="119">FIXED CIRCLE</text><rect x="630" y="80" width="240" height="580" rx="18" fill="#26384b"/><text x="648" y="119">LOW RING</text><rect x="930" y="80" width="240" height="580" rx="18" fill="#26384b"/><text x="948" y="119">CHEST SWEEP</text><path d="M130 190V490" stroke="#f17d6c" stroke-width="35"/><path d="M115 190V490M145 190V490" stroke="white" stroke-width="3"/><circle cx="130" cy="405" r="24" fill="#eee9c9"/><path d="M160 405H228l-14-13m14 13-14 13" stroke="#68dcbe" stroke-width="6" fill="none"/><text x="50" y="545" class="small">Side-step 0.4-0.8 m</text><text x="50" y="576" class="small">Never retarget mid-cast</text><circle cx="450" cy="350" r="65" fill="#df655c" stroke="white" stroke-width="3"/><circle cx="450" cy="350" r="23" fill="#eee9c9"/><path d="M475 350H548l-14-13m14 13-14 13" stroke="#68dcbe" stroke-width="6" fill="none"/><text x="350" y="545" class="small">Radius 0.30-0.35 m</text><text x="350" y="576" class="small">Keep safe landing inside AR</text><path d="M650 480H850" stroke="#a7bac7" stroke-width="4"/><ellipse cx="745" cy="472" rx="75" ry="15" fill="none" stroke="#ffb55d" stroke-width="8"/><circle cx="750" cy="280" r="20" fill="#eee9c9"/><path d="M750 305V370l-24 35 24 18m0-53 32 32-20 19" fill="none" stroke="#eee9c9" stroke-width="12"/><path d="M805 370V270l-13 15m13-15 13 15" fill="none" stroke="#ffb55d" stroke-width="5"/><text x="650" y="545" class="small">Jump / arrive after countdown</text><text x="650" y="576" class="small">Same action hits >= 2 s apart</text><path d="M950 480H1150" stroke="#a7bac7" stroke-width="4"/><path d="M955 310H1145" stroke="#65cbef" stroke-width="16"/><circle cx="1040" cy="365" r="20" fill="#eee9c9"/><path d="M1040 388l25 35-30 20 22 30m8-50 30 20-5 30" fill="none" stroke="#eee9c9" stroke-width="12"/><path d="M1110 350V400l-13-15m13 15 13-15" fill="none" stroke="#65cbef" stroke-width="5"/><text x="950" y="545" class="small">Crouch / do not duck and jump</text><text x="950" y="576" class="small">Opposite actions >= 1 s apart</text><text x="40" y="706" class="small">Design diagrams only. Inflate by body radius once. No safe point within 1 m = delay / cancel.</text></svg>