# ===== leadgen 設定 =====
# 預設值是針對「軟體 + 韌體 + 機構」一條龍接案者調的,請照你的實際狀況改。

db: data/leads.sqlite3

network:
  # 必填:爬取時 User-Agent 會帶這個信箱,讓對方站長找得到人。
  contact_email: ""
  bot_name: leadgen-bot
  cache_dir: data/.cache
  cache_ttl_hours: 12
  rate_per_host: 1.5      # 每個網域每秒最多幾次請求
  timeout: 25
  max_retries: 3
  respect_robots: true    # 不要關掉

# ---------- 來源 ----------
sources:
  # 政府標案:法律風險最低、意圖最強。機關聯絡人與預算金額都是法定公開資訊。
  gov_tender:
    enabled: true
    keywords:
      # 軟體 / 韌體
      - 韌體
      - 嵌入式
      - 系統開發
      - 軟體開發
      - 物聯網
      - 電路設計
      - 控制器
      # 機構 / 打樣(家裡有 3D 列印機就吃得到這一段)
      - 機構設計
      - 自動化設備
      # 不要加「試作」:中文沒有詞界,它會命中「向量圖磚測<試作>業」這種標題。
      # 同理不要加「模型」(會命中「數值模型」)或「設計」(命中「設計監造」)。
      - 3D列印
      - 積層製造
      - 快速成型
      - 原型
      - 樣品製作
      - 模型製作
      - 逆向工程
      - 3D掃描
      - 治具
      - 夾具
      - 機構件
    max_pages: 2          # 每個關鍵字抓幾頁(一頁約 100 筆)
    within_days: 120
    # 抓細節頁的上限。聯絡信箱與預算金額只存在細節頁,沒抓到的名單 reach 與
    # budget 都是 0 分,所以這個數字直接決定有幾筆能上 70 分。
    # 每筆一次請求,在 1.5 req/s 的限速下 60 筆約 40 秒。
    detail_fetches: 60
    include_awards: true  # 決標公告 = 看哪些機關固定在買、誰在搶
    drop_expired: true    # 投標期限已過的案子直接丟掉(設 false 會留著當情報)
    # 標案分四類:service(找人做)、goods(買零件,能代工就是機會)、
    # equipment(買現成設備/軟體,對你無用)、construction(土木)。
    # 打樣類關鍵字有九成命中 equipment,所以預設丟掉它和土木。
    drop_kinds: [equipment, construction]
    # 個人接案者沒有營業登記,過不了大案子的資格審。開著只留兩種:
    # 「公開徵求廠商提供參考資料」(RFI,無資格門檻,而且是讓機關認識你最便宜
    # 的方式)與「公開取得報價單或企劃書」(未達公告金額,機關可直接洽個人),
    # 外加細節頁顯示「未達公告金額」的小額採購。
    # 之後成立公司行號了就改成 false,整個標案市場才會打開。
    individual_only: true

  # HN 每月外包串:對方自己公開徵求接案者並留下聯絡方式,可直接寫信。
  hn_freelance:
    enabled: true
    threads: 3            # 抓最近幾串
    include_who_is_hiring: true
    skill_keywords:
      - firmware
      - embedded
      - rtos
      - stm32
      - esp32
      - zephyr
      - bare metal
      - hardware
      - pcb
      - mechanical
      - cad
      - solidworks
      - iot
      - driver
      - kernel
      - bluetooth
      - 3d printing
      - prototyping
      - enclosure
      - injection molding
      - cad
      - mechanical design

  # 遠端職缺(Remote OK API + We Work Remotely RSS):
  # 公司在徵這類工程師 = 有專案缺人,是外包切入點;國外客戶預算通常高一個級距。
  # 注意:Remotive 的 robots.txt 明文禁止抓 /api/*,所以沒有收錄。
  job_boards:
    enabled: true
    remoteok: true
    weworkremotely: true
    require_title_match: true   # 關鍵字只在內文出現不算,避免撈到業務職缺
    # 只比對職稱,而且用詞界比對 —— 單字太泛的(hardware、driver)會撈到一堆雜訊,
    # 所以用詞組。這裡寧可漏抓也不要髒名單。
    keywords:
      - firmware
      - embedded
      - rtos
      - microcontroller
      - fpga
      - pcb
      - hardware engineer
      - mechanical engineer
      - electrical engineer
      - robotics
      - iot
      - prototype
      - design engineer
      - product design

  # 外包平台:個人投標是常態,不需要任何公司資格。客戶是中小企業與個人。
  # 兩個門檻一定要套,否則會灌進一堆 $30-250 搭配 90 幾人投標的殺價案。
  freelancer:
    enabled: true
    queries: [firmware, embedded, stm32, pcb, mechanical design, 3d printing,
              enclosure, iot, reverse engineering]
    limit_per_query: 30
    min_budget_twd: 15000     # 預算下限(台幣)
    max_bids: 40              # 投標人數上限,人越多勝率與單價越低

  # PTT 發案貼文。實測各板第一頁的需求密度:CodeJob 3/21(軟體外包,[發案]
  # 標籤)、Mechanical 5/21(加工與機構,[徵求])、Soho 4/14 但全是行銷攝影、
  # Programming 0/21。所以主力是前兩個板。
  # Soho 預設不放進來:實測 5 頁 45 篇需求貼文只濾出 3 筆,而且是 1000~1500 元
  # 的行銷微案。如果你也接小型網站或自動化腳本,再把它加回 boards。
  ptt:
    enabled: true
    pages: 3
    boards:
      - {name: CodeJob, tags: ["[發案]", "[徵才]", "[外包]"]}
      - {name: Mechanical, tags: ["[徵求]", "[徵才]"]}
      # - {name: Soho, tags: ["[徵才]", "[外包]", "[委託]"]}
    individual_only: false    # 設 true 只留「理想接案對象:個人接案」(僅 Soho 板有此欄位)
    drop_expired: true
    keywords: [程式, 軟體, 網站, 系統, app, 後端, api, 韌體, 電路, 硬體,
               機構, 3d, 列印, 打樣, 模型, 加工, 治具, 夾具, 外殼, 自動化,
               python, 嵌入式, 微控制, arduino, esp32, 樹莓派, raspberry,
               爬蟲, 資料庫, 整合, 手臂, 設備, 逆向, 繪圖, cad, solidworks]
    # 命中就排除。Soho 板以行銷與平面設計為主,光靠正面關鍵字會把「網站SEO」
    # 「名片設計」一起撈進來 —— 它們的內容描述也會提到網站與系統。
    exclude_keywords: [seo, 行銷, 廣告投放, 美編, 排版, 名片, 視覺設計, 文案,
                       社群經營, 小編, 剪輯, 配音, 翻譯, 攝影, 模特, 手模,
                       代購, 幣圈, 推廣夥伴, 合租, 問卷]

  # 公司登記資料:只用來產生目標名單,不含任何個人聯絡資訊。
  # 預設關掉,因為它沒有意圖訊號,開了會把資料庫灌滿低分名單。
  # 要做「主動開發特定產業」時再開。
  tw_company:
    enabled: false
    name_keywords: [科技, 電子, 自動化, 精密, 機電, 智能]
    industry_terms: [電子零組件, 機械設備, 資訊軟體, 電腦及其週邊, 精密儀器, 自動控制]
    regions: [新竹, 台中, 桃園, 台南, 新北, 台北]
    min_capital: 10000000   # 資本額門檻:太小的公司通常沒有外包預算
    max_pages: 2

# ---------- 聯絡方式補齊 ----------
enrich:
  enabled: true
  max_sites: 25           # 每次最多對幾個官網做聯絡頁抓取
  pages_per_site: 4
  min_prescore: 35        # 只對預估分數夠高的花網路成本

# ---------- 評分 ----------
scoring:
  weights:                # 總和 100
    intent: 30
    budget: 25
    fit: 25
    reach: 10
    fresh: 10
  # 預算到這個數字就拿滿分。30 萬是「對一個人來說是大案子」的量級 ——
  # 原本設 200 萬是照政府標案的刻度,結果 20 萬的外包案(對個人是好案子)
  # 只拿到 2.5/25 分,所有小客戶來源都被系統性壓在標案底下。
  # 如果你之後成立公司行號、開始接百萬級的案子,再把它調回去。
  budget_full_at_twd: 300000
  # 「預算未公開」拿到的比例。政府標案有一大部分不公開預算,職缺也多半不寫薪資,
  # 把未知當 0 分等於懲罰資料缺失。設 0 會變回舊行為。
  unknown_budget_ratio: 0.4
  fresh_half_life_days: 30
  profile:
    # 核心技能:命中就是高契合
    core: [韌體, firmware, 嵌入式, embedded, 機構設計, mechanical, rtos,
           stm32, esp32, 驅動程式, 電路, pcb, 系統開發, 軟體開發,
           # 自家有 3D 列印機 -> 打樣與機構製作也算核心能力
           3d列印, 積層製造, 快速成型, 打樣, 原型, prototype, 3d printing,
           樣品製作, 模型製作, 治具, 夾具, 機構件]
    # 加分項
    plus: [iot, 物聯網, bluetooth, ble, can bus, modbus, 自動化, solidworks,
           linux, python, 量測, 控制器, 感測器,
           外殼, 殼件, 逆向工程, 3d掃描, 公差, 射出成型, cnc, fusion 360]
    # 命中就直接 0 分(避開你不做的案型)
    # 命中就直接 0 分。職訓課程類特別要擋 —— 「AI智動控制與3D列印設計班」
    # 會命中 3D列印,但那是在找講師開課,不是找人做東西。
    exclude: [教育訓練, 職業訓練, 職前, 訓練班, 設計班, 課程, 招生, 師資, 研習,
              營隊, 保全, 清潔, 派遣, 保險, 房屋仲介]
