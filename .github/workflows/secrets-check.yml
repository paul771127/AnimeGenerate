name: Secrets check (TestFlight)

# 只檢查 secrets 是否存在、格式是否正確；不印出任何內容
on:
  push:
    branches: [claude/spellduel-testflight]
    paths: ['.github/workflows/secrets-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          R=""
          for n in IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD IOS_APPSTORE_PROFILE_BASE64 APPSTORE_ISSUER_ID APPSTORE_API_KEY_ID APPSTORE_API_PRIVATE_KEY; do
            v="${!n}"; if [ -z "$v" ]; then R="$R $n=MISSING"; else R="$R $n=len${#v}"; fi
          done
          T=$(mktemp -d)
          if printf '%s' "$IOS_DIST_P12_BASE64" | base64 -d > $T/p.p12 2>/dev/null && [ -s $T/p.p12 ]; then
            if openssl pkcs12 -in $T/p.p12 -nokeys -passin env:IOS_DIST_P12_PASSWORD -noout 2>/dev/null || openssl pkcs12 -legacy -in $T/p.p12 -nokeys -passin env:IOS_DIST_P12_PASSWORD -noout 2>/dev/null; then R="$R p12+password=OK"; else R="$R p12+password=FAIL"; fi
          else R="$R p12=BAD_BASE64"; fi
          if printf '%s' "$IOS_APPSTORE_PROFILE_BASE64" | base64 -d 2>/dev/null | grep -aq "com.paul771127.spellduel</string>"; then R="$R profile=OK"; else R="$R profile=BAD"; fi
          case "$APPSTORE_API_PRIVATE_KEY" in *"BEGIN PRIVATE KEY"*"END PRIVATE KEY"*) R="$R p8=OK";; *) R="$R p8=BAD_FORMAT";; esac
          [[ "$APPSTORE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] && R="$R keyid=OK" || R="$R keyid=BAD_FORMAT"
          [[ "$APPSTORE_ISSUER_ID" =~ ^[0-9a-f-]{36}$ ]] && R="$R issuer=OK" || R="$R issuer=BAD_FORMAT"
          rm -rf $T
          echo "::notice::$R"
