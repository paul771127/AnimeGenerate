# 複製成 config.yaml 後修改;沒寫到的欄位使用預設值(見 animegen/config.py)
backend: auto          # 影片模式後端:auto | wan22 | wan21 | ltx | cogvideox | mock
device: auto           # auto | cuda | mps | cpu
memory_mode: auto      # auto | full | model_offload | sequential_offload
output_dir: outputs
model_cache_dir: null  # 模型下載位置;null = ~/.cache/huggingface

generation:
  num_frames: null     # null = 模型預設(Wan2.2: 81 幀 ≈ 3.4 秒)
  num_inference_steps: null
  seed: -1
  resolution: auto     # 或 832x480
  fit_mode: crop       # crop | pad | stretch
  background: [255, 255, 255]

# 多張圖逐格動畫(animegen frames)
keyframe:
  editor: auto         # auto | qwen | kontext | mock
  quantize: auto       # auto | none | 4bit
  num_poses: 4         # 沒有內建範本時拆成幾格
  steps: null          # null = 模型預設
  max_area: auto       # 工作解析度(像素總數),out of memory 時改成 589824 (768x768)
  inbetween: 1         # 補間層數 0-3:每兩個姿勢之間補 0/1/3/7 張(越多越連續、越久)
  fast: true           # Qwen 加速(Lightning LoRA 8 步)
  frame_ms: null       # 每格停留毫秒數;null = 依補間層數自動
  tweens: 0            # 每兩格之間的淡入淡出過渡格數
  pingpong: false
  include_original: true
  gif_max_width: 512

prompt:
  enhancer: none       # none | ollama(影片模式改寫提示詞;多張圖模式拆解沒有範本的動作)
  ollama:
    host: http://127.0.0.1:11434
    model: qwen2.5:7b

export:
  formats: [gif, mp4]
  pingpong: false
  interpolate: 1       # 2 = ffmpeg 補幀成兩倍 fps
  gif_max_width: 512
