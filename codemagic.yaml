# SpellDuel（spellduel-unity/）在 Codemagic 編譯：
#   spellduel-ios      → 未簽署 IPA（用 Sideloadly + 免費 Apple ID 安裝）
#   spellduel-android  → APK
#
# Codemagic 設定（一次性）：Teams/App settings → Environment variables，建立群組 unity_credentials：
#   UNITY_EMAIL     Unity 帳號 email
#   UNITY_PASSWORD  Unity 帳號密碼
#   以及下面二選一：
#   UNITY_SERIAL    Unity Plus/Pro 序號（Codemagic 官方支援的方式）
#   UNITY_LICENSE   免費個人版：電腦上 Unity_lic.ulf 的完整內容（非官方支援，啟用失敗時請改用 GitHub Actions）
# 兩個流程都只會手動觸發（Codemagic 網頁 → Start new build → 選流程與分支）。

definitions:
  unity_env: &unity_env
    unity: 2022.3.62f2
    groups:
      - unity_credentials
    vars:
      PROJECT_DIR: spellduel-unity
      BUILD_METHOD: SpellDuel.EditorTools.BuildScript.Build

  activate_license: &activate_license
    name: 啟用 Unity 授權
    script: |
      set -e
      if [ -n "$UNITY_SERIAL" ]; then
        "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile - \
          -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
      elif [ -n "$UNITY_LICENSE" ]; then
        echo "使用個人版授權檔（Unity_lic.ulf）"
        sudo mkdir -p "/Library/Application Support/Unity"
        printf '%s' "$UNITY_LICENSE" | sudo tee "/Library/Application Support/Unity/Unity_lic.ulf" > /dev/null
      else
        echo "請在 unity_credentials 群組設定 UNITY_SERIAL 或 UNITY_LICENSE"; exit 1
      fi

  return_license: &return_license
    name: 歸還 Unity 授權
    script: |
      if [ -n "$UNITY_SERIAL" ]; then
        "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile - \
          -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
      fi

workflows:
  spellduel-ios:
    name: SpellDuel iOS（未簽署 IPA）
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      <<: *unity_env
      xcode: latest
    scripts:
      - *activate_license
      - name: 安裝 Unity iOS 模組
        script: |
          yes Y | "/Applications/Unity Hub.app/Contents/MacOS/Unity Hub" -- --headless install-modules \
            --version 2022.3.62f2 -m ios -a arm64 || echo "（模組可能已安裝）"
      - name: Unity 匯出 Xcode 專案
        script: |
          set -e
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile "$CM_BUILD_DIR/unity-ios.log" \
            -projectPath "$CM_BUILD_DIR/$PROJECT_DIR" -buildTarget iOS \
            -executeMethod "$BUILD_METHOD" -customBuildPath "$CM_BUILD_DIR/build/iOS/SpellDuel" \
            || { tail -200 "$CM_BUILD_DIR/unity-ios.log"; exit 1; }
          tail -30 "$CM_BUILD_DIR/unity-ios.log"
      - name: 編譯未簽署 IPA
        script: |
          set -eo pipefail
          PROJ=$(find "$CM_BUILD_DIR/build/iOS" -maxdepth 3 -name "Unity-iPhone.xcodeproj" | head -1)
          echo "Xcode 專案：$PROJ"
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$CM_BUILD_DIR/dd" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | tail -80
          APP=$(find "$CM_BUILD_DIR/dd/Build/Products" -maxdepth 3 -name "*.app" | head -1)
          mkdir -p "$CM_BUILD_DIR/Payload" && cp -R "$APP" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR" && zip -qry SpellDuel-unsigned.ipa Payload
          ls -la SpellDuel-unsigned.ipa
    artifacts:
      - SpellDuel-unsigned.ipa
      - unity-ios.log
    publishing:
      scripts:
        - *return_license

  spellduel-android:
    name: SpellDuel Android（APK）
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      <<: *unity_env
    scripts:
      - *activate_license
      - name: 安裝 Unity Android 模組
        script: |
          yes Y | "/Applications/Unity Hub.app/Contents/MacOS/Unity Hub" -- --headless install-modules \
            --version 2022.3.62f2 -m android android-sdk-ndk-tools android-open-jdk -a arm64 || echo "（模組可能已安裝）"
      - name: Unity 編譯 APK
        script: |
          set -e
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile "$CM_BUILD_DIR/unity-android.log" \
            -projectPath "$CM_BUILD_DIR/$PROJECT_DIR" -buildTarget Android \
            -executeMethod "$BUILD_METHOD" -customBuildPath "$CM_BUILD_DIR/build/Android/SpellDuel.apk" \
            || { tail -200 "$CM_BUILD_DIR/unity-android.log"; exit 1; }
          ls -la "$CM_BUILD_DIR/build/Android"
    artifacts:
      - build/Android/*.apk
      - unity-android.log
    publishing:
      scripts:
        - *return_license
