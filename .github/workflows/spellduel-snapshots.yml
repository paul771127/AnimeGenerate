name: SpellDuel snapshots (character renders)

# 用 Unity 編輯器把角色與召喚物拍成 PNG（給沒有手機在旁邊時看造型）
on:
  push:
    paths:
      - 'spellduel-unity/Assets/SpellDuel/Editor/Snapshot.cs'
      - '.github/workflows/spellduel-snapshots.yml'
  workflow_dispatch:

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: spellduel-unity/Library
          key: Library-Android-${{ hashFiles('spellduel-unity/Packages/manifest.json', 'spellduel-unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: spellduel-unity
          targetPlatform: Android
          buildName: SpellDuel
          buildMethod: SpellDuel.EditorTools.Snapshot.Render
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        with:
          name: SpellDuel-snapshots
          path: spellduel-unity/snapshots/*.png
          if-no-files-found: error
