<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520"><rect width="1200" height="520" fill="#182331"/><style>text{font-family:Arial,sans-serif;fill:#eef3ed;font-size:21px}.small{font-size:16px}</style><text x="40" y="50">GLOBAL BODY-ACTION SLOT / ONE OFFENSIVE WARNING AT A TIME</text><text x="35" y="160">Enemy A</text><text x="35" y="280">Enemy B</text><text x="35" y="400">Support</text><rect x="180" y="120" width="240" height="52" rx="8" fill="#c78d47"/><text x="189" y="151" class="small">Visible warning</text><rect x="420" y="120" width="210" height="52" rx="8" fill="#bf6056"/><text x="429" y="151" class="small">Travel / danger</text><rect x="630" y="120" width="125" height="52" rx="8" fill="#567d6b"/><text x="639" y="151" class="small">Recovery</text><rect x="780" y="240" width="280" height="52" rx="8" fill="#4c8fac"/><text x="789" y="271" class="small">Next warning</text><rect x="1060" y="240" width="100" height="52" rx="8" fill="#bf6056"/><text x="1069" y="271" class="small">Strike</text><rect x="260" y="360" width="400" height="52" rx="8" fill="#456c69"/><text x="269" y="391" class="small">Small support cast / interrupt option</text><path d="M630 180v52h145" fill="none" stroke="#eee9c9" stroke-width="3"/><text x="180" y="310" class="small">Next slot waits for danger to clear AND recovery. Arrival time is not release time.</text><text x="40" y="475" class="small">Jump-to-jump / crouch-to-crouch: >=2s between hits. Jump-to-crouch: >=1s. Network visibility extends warning.</text></svg>