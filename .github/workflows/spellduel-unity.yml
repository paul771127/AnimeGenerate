name: SpellDuel Unity build (Android APK + iOS unsigned IPA)

# 推送 spellduel-unity/ 的變更時自動編譯；也可以在 Actions 頁面手動執行
on:
  push:
    paths:
      - 'spellduel-unity/**'
      - '.github/workflows/spellduel-unity.yml'
  workflow_dispatch:

concurrency:
  group: spellduel-unity-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: spellduel-unity
  BUILD_METHOD: SpellDuel.EditorTools.BuildScript.Build

jobs:
  # 沒有設定 Unity 授權時跳過編譯（顯示提示，不讓整個流程變紅）
  check-license:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::尚未設定 UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD，略過 Unity 編譯。設定方式見 spellduel-unity/README.md"
          fi

  android:
    needs: check-license
    if: needs.check-license.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 釋放磁碟空間（Unity 映像檔很大）
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-${{ hashFiles('spellduel-unity/Packages/manifest.json', 'spellduel-unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      # 固定的 Android 簽章金鑰：每次建置都用同一把，手機才能直接覆蓋更新。
      # 有設定 secrets.ANDROID_KEYSTORE_BASE64（＋ANDROID_KEYSTORE_PASS）就用它；否則第一次自動產生一把，存在 Actions 快取裡重複使用。
      - name: 簽章金鑰（快取）
        uses: actions/cache@v4
        with:
          path: ci-keystore
          key: spellduel-android-keystore-v1
      - name: 準備簽章金鑰
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -eo pipefail
          mkdir -p ci-keystore
          PASS="${KS_PASS:-spellduel-ci}"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ci-keystore/spellduel.keystore
            echo "使用 secrets 裡的簽章金鑰"
          elif [ ! -f ci-keystore/spellduel.keystore ]; then
            keytool -genkeypair -keystore ci-keystore/spellduel.keystore -alias spellduel -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=SpellDuel, O=SpellDuel"
            echo "產生新的簽章金鑰（之後都用這一把）"
          else
            echo "沿用快取裡的簽章金鑰"
          fi
          keytool -list -v -keystore ci-keystore/spellduel.keystore -storepass "$PASS" | grep -m1 "SHA256:" || true
          B64=$(base64 -w0 ci-keystore/spellduel.keystore)
          echo "::add-mask::$B64"
          echo "::add-mask::$PASS"
          echo "b64=$B64" >> "$GITHUB_OUTPUT"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: Android
          buildName: SpellDuel
          buildMethod: ${{ env.BUILD_METHOD }}
          allowDirtyBuild: true
          customParameters: -sdCloudProjectId ${{ secrets.UNITY_CLOUD_PROJECT_ID }}
          androidKeystoreName: spellduel.keystore
          androidKeystoreBase64: ${{ steps.keystore.outputs.b64 }}
          androidKeystorePass: ${{ steps.keystore.outputs.pass }}
          androidKeyaliasName: spellduel
          androidKeyaliasPass: ${{ steps.keystore.outputs.pass }}
      - name: 檢查 APK 簽章
        run: |
          APK=$(ls build/Android/*.apk | head -1)
          SIGNER=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$SIGNER" ]; then "$SIGNER" verify --print-certs "$APK" | grep -m2 -E "SHA-256|DN" || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: SpellDuel-Android-APK
          path: build/Android/*.apk
          if-no-files-found: error

  ios-export:
    needs: check-license
    if: needs.check-license.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 釋放磁碟空間（Unity 映像檔很大）
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-iOS-${{ hashFiles('spellduel-unity/Packages/manifest.json', 'spellduel-unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-iOS-
      # 第一階段：只做設定（加入 ARKit 編譯符號），第二階段重新開 Unity 才會把 ARKit 原生程式庫打包進去
      - name: Unity 設定（第一階段）
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildName: SpellDuel
          buildMethod: SpellDuel.EditorTools.BuildScript.ConfigureCI
          allowDirtyBuild: true
          customParameters: -sdCloudProjectId ${{ secrets.UNITY_CLOUD_PROJECT_ID }}
      - name: Unity 匯出 Xcode 專案（第二階段）
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildName: SpellDuel
          buildMethod: ${{ env.BUILD_METHOD }}
          allowDirtyBuild: true
          customParameters: -sdCloudProjectId ${{ secrets.UNITY_CLOUD_PROJECT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: SpellDuel-iOS-XcodeProject
          path: build/iOS
          if-no-files-found: error

  # 公開 repo 的 GitHub macOS 機器免費；產出「未簽署」IPA（之後由 ios-testflight 簽章上傳）
  # App Store Connect 要求用 iOS 26 SDK（Xcode 26）以上編譯，所以用 macos-26 機器
  ios-ipa:
    needs: ios-export
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: spellduel-unity/AppIcon
      - uses: actions/download-artifact@v4
        with:
          name: SpellDuel-iOS-XcodeProject
          path: xcode
      - name: 放入 App 圖示（1024×1024，App Store 必要）
        run: |
          set -eo pipefail
          ICON=src/spellduel-unity/AppIcon/AppIcon-1024.png
          ICONSET=$(find xcode -type d -path "*Images.xcassets/AppIcon.appiconset" | head -1)
          if [ -z "$ICONSET" ]; then
            XCASSETS=$(find xcode -type d -name "Images.xcassets" | head -1)
            ICONSET="$XCASSETS/AppIcon.appiconset"; mkdir -p "$ICONSET"
          fi
          echo "圖示資料夾：$ICONSET"
          rm -f "$ICONSET"/*
          cp "$ICON" "$ICONSET/AppIcon-1024.png"
          # 單一尺寸圖示：Xcode 會自動產生其他所有尺寸
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "AppIcon-1024.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
      - name: 編譯未簽署 IPA
        run: |
          set -eo pipefail
          xcodebuild -version
          PROJ=$(find xcode -name "Unity-iPhone.xcodeproj" -maxdepth 3 | head -1)
          echo "Xcode 專案：$PROJ"
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | tail -50
          APP=$(find dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry SpellDuel-unsigned.ipa Payload
          ls -la SpellDuel-unsigned.ipa
          echo "--- 檢查：SDK 版本與 1024 圖示 ---"
          /usr/libexec/PlistBuddy -c "Print :DTSDKName" Payload/*.app/Info.plist || true
          xcrun --sdk iphoneos assetutil --info Payload/*.app/Assets.car | grep -E '"(Name|PixelHeight)"' | grep -B1 '1024' | head -4 || echo "::warning::Assets.car 裡沒找到 1024 圖示"
      - uses: actions/upload-artifact@v4
        with:
          name: SpellDuel-iOS-unsigned-IPA
          path: SpellDuel-unsigned.ipa
          if-no-files-found: error

  # 把最新 APK 放到公開的 Release（不用登入 GitHub 就能下載，網址固定）：
  #   https://github.com/<owner>/<repo>/releases/download/spellduel-latest/SpellDuel.apk
  publish-apk:
    needs: android
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SpellDuel-Android-APK
          path: apk
      - name: 上傳到 Release「spellduel-latest」
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          cp "$(ls apk/*.apk | head -1)" SpellDuel.apk
          NOTES="最新 Android 版（${GITHUB_SHA::7}，$(date -u +'%Y-%m-%d %H:%M') UTC）。下載 SpellDuel.apk 直接安裝。"
          if ! gh release view spellduel-latest >/dev/null 2>&1; then
            gh release create spellduel-latest --target "$GITHUB_SHA" --title "SpellDuel 最新測試版" --notes "$NOTES" --latest
          fi
          gh release upload spellduel-latest SpellDuel.apk --clobber
          gh release edit spellduel-latest --notes "$NOTES"

  # 用 Apple Distribution 憑證重簽 IPA，上傳到 App Store Connect（TestFlight）。
  # 需要的 secrets（缺任何一個就自動略過，不會讓流程變紅）：
  #   IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD / IOS_APPSTORE_PROFILE_BASE64
  #   APPSTORE_ISSUER_ID / APPSTORE_API_KEY_ID / APPSTORE_API_PRIVATE_KEY
  ios-testflight:
    needs: ios-ipa
    runs-on: ubuntu-latest
    timeout-minutes: 75  # 上傳後會等 Apple 處理完 build（可能 30 分鐘以上）
    steps:
      - name: 檢查簽章與上傳設定
        id: check
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASS" ] && [ -n "$PROFILE" ] && [ -n "$ISSUER" ] && [ -n "$KEY_ID" ] && [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::尚未設定 iOS 簽章 / App Store Connect secrets，略過 TestFlight 上傳。"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: SpellDuel-iOS-unsigned-IPA
          path: unsigned

      - name: 編譯 zsign（Linux 上的 iOS 簽章工具）
        if: steps.check.outputs.ok == 'true'
        run: |
          set -eo pipefail
          sudo apt-get update -q >/dev/null
          sudo apt-get install -y -q g++ make pkg-config libssl-dev libminizip-dev zlib1g-dev >/dev/null
          git clone -q https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign"
          git -C "$RUNNER_TEMP/zsign" checkout -q 9299685bab7ef99827e06e5dfda93af747386590
          make -C "$RUNNER_TEMP/zsign/build/linux" -j4 >/dev/null
          echo "$RUNNER_TEMP/zsign/bin" >> "$GITHUB_PATH"

      - name: 調整 Info.plist 並簽章
        id: sign
        if: steps.check.outputs.ok == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -eo pipefail
          S="$RUNNER_TEMP/sign"; mkdir -p "$S/x"
          echo "$P12" | base64 -d > "$S/dist.p12"
          echo "$PROFILE" | base64 -d > "$S/appstore.mobileprovision"
          unzip -q unsigned/SpellDuel-unsigned.ipa -d "$S/x"
          PLIST=$(ls -d "$S"/x/Payload/*.app)/Info.plist
          # Build 號：Unity 寫入的 yyMMddHH 加上流程編號，同一小時內多次建置也不會撞號
          python3 -I - "$PLIST" "${{ github.run_number }}" <<'PY'
          import plistlib, sys
          path, run = sys.argv[1], sys.argv[2]
          with open(path, 'rb') as f: p = plistlib.load(f)
          base = str(p.get('CFBundleVersion', '0')).split('.')[0]
          p['CFBundleVersion'] = f"{base}.{run}"
          p['ITSAppUsesNonExemptEncryption'] = False
          with open(path, 'wb') as f: plistlib.dump(p, f)
          print("Bundle ID:", p['CFBundleIdentifier'], " Version:", p.get('CFBundleShortVersionString'), " Build:", p['CFBundleVersion'])
          PY
          (cd "$S/x" && zip -qry "$S/patched.ipa" Payload)
          zsign -k "$S/dist.p12" -p "$P12_PASS" -m "$S/appstore.mobileprovision" -o "$S/signed.ipa" "$S/patched.ipa"
          # zsign 輸出不壓縮，重新壓縮讓上傳更快
          rm -rf "$S/y" && mkdir -p "$S/y" && unzip -q "$S/signed.ipa" -d "$S/y"
          (cd "$S/y" && zip -q -9 -ry "$GITHUB_WORKSPACE/SpellDuel-appstore.ipa" Payload)
          rm -f "$S/dist.p12"
          ls -la "$GITHUB_WORKSPACE/SpellDuel-appstore.ipa"
          echo "ipa=$GITHUB_WORKSPACE/SpellDuel-appstore.ipa" >> "$GITHUB_OUTPUT"

      - name: 上傳到 TestFlight
        if: steps.check.outputs.ok == 'true'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.sign.outputs.ipa }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # 加密申報已寫在 Info.plist（ITSAppUsesNonExemptEncryption=false），不再用 API 另外設定
