name: TestFlight group – turn off automatic distribution (one-off)

# 一次性：列出 SpellDuel 的 TestFlight 群組（只印名稱與設定，不印測試者資料），
# 如果「剛好只有一個」開著自動發佈的內部群組，就試著把它的自動發佈關掉。
on:
  push:
    branches: [claude/spellduel-testflight]
    paths: ['.github/workflows/asc-beta-group.yml']

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q "pyjwt[crypto]==2.9.0" requests==2.32.3
      - env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          BUNDLE: com.paul771127.spellduel
        shell: python
        run: |
          import os, time, jwt, requests
          tok = jwt.encode({"iss": os.environ["ISSUER"], "iat": int(time.time()), "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"},
                           os.environ["KEY"], algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {tok}", "Content-Type": "application/json"}
          API = "https://api.appstoreconnect.apple.com/v1"
          def note(msg): print(f"::notice::{msg}")
          apps = requests.get(f"{API}/apps", params={"filter[bundleId]": os.environ["BUNDLE"]}, headers=H).json()["data"]
          app = apps[0]["id"]
          r = requests.get(f"{API}/apps/{app}/betaGroups", params={"fields[betaGroups]": "name,isInternalGroup,hasAccessToAllBuilds", "limit": 50}, headers=H)
          r.raise_for_status()
          groups = r.json()["data"]
          for g in groups:
              a = g["attributes"]
              note(f"GROUP id={g['id']} name={a.get('name')} internal={a.get('isInternalGroup')} autoAllBuilds={a.get('hasAccessToAllBuilds')}")
          auto = [g for g in groups if g["attributes"].get("isInternalGroup") and g["attributes"].get("hasAccessToAllBuilds")]
          if len(auto) != 1:
              note(f"SKIP: {len(auto)} internal groups with automatic distribution (need exactly 1) – nothing changed")
          else:
              g = auto[0]
              body = {"data": {"type": "betaGroups", "id": g["id"], "attributes": {"hasAccessToAllBuilds": False}}}
              p = requests.patch(f"{API}/betaGroups/{g['id']}", json=body, headers=H)
              note(f"PATCH {g['attributes']['name']}: HTTP {p.status_code}")
              if p.status_code >= 300:
                  for e in p.json().get("errors", []): note(f"ERROR {e.get('code')}: {e.get('title')} – {e.get('detail')}")
              else:
                  after = requests.get(f"{API}/betaGroups/{g['id']}", params={"fields[betaGroups]": "name,hasAccessToAllBuilds"}, headers=H).json()["data"]["attributes"]
                  note(f"AFTER name={after.get('name')} autoAllBuilds={after.get('hasAccessToAllBuilds')}")
