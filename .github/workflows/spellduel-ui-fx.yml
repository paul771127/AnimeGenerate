# Native renderer and runtime-budget acceptance for batch C.
name: SpellDuel native skill FX polish validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'spellduel-unity/Assets/SpellDuel/Runtime/SpellFx*.cs'
      - 'spellduel-unity/Assets/SpellDuel/Runtime/AdvancedFx.cs'
      - 'spellduel-unity/Assets/SpellDuel/Editor/Snapshot.UiSkillFx.cs'
      - '.github/workflows/spellduel-ui-fx.yml'
concurrency:
  group: ui-fx-polish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-fx:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: spellduel-unity/Library
          key: Library-Android-${{ hashFiles('spellduel-unity/Packages/manifest.json', 'spellduel-unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: spellduel-unity
          targetPlatform: Android
          buildName: SpellDuel
          buildMethod: SpellDuel.EditorTools.Snapshot.RenderUiSkillFx
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpellDuel-polish-fx
          path: |
            spellduel-unity/snapshots/polish_fx*
          if-no-files-found: error
